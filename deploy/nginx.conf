# Social media bot detection
map $http_user_agent $is_social_bot {
    default                     0;
    ~*facebookexternalhit       1;
    ~*Facebot                   1;
    ~*Twitterbot                1;
    ~*LinkedInBot               1;
    ~*Discordbot                1;
    ~*Slackbot                  1;
    ~*TelegramBot               1;
    ~*WhatsApp                  1;
}

# Real client address: the site runs behind a reverse proxy on a private Docker
# network, so trust X-Forwarded-For only from private ranges and keep the rightmost
# untrusted address (a client cannot forge it).
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

# Per-IP rate limit on account creation and password reset requests
limit_req_zone $binary_remote_addr zone=auth_sensitive:10m rate=1r/m;
limit_req_status 429;

server {
    listen 80;
    server_name _;

    client_max_body_size 20M;

    # Account creation and password reset → backend, rate limited
    location ~ ^/api/auth/(register|reset-password)$ {
        limit_req zone=auth_sensitive burst=5 nodelay;
        error_page 429 = @rate_limited;
        proxy_pass http://backend:8000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location @rate_limited {
        default_type application/json;
        return 429 '{"detail":"Trop de tentatives, réessayez dans quelques minutes"}';
    }

    # API requests → backend (FastAPI on port 8000)
    location ~ ^/api(/.*)?$ {
        proxy_pass http://backend:8000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Everything else → frontend (nginx serving static files on port 80)
    location / {
        # Serve OG meta tags to social media bots
        if ($is_social_bot) {
            rewrite ^(.*)$ /api/og?path=$1 last;
        }

        proxy_pass http://frontend:80;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;

        # Pass cache headers from frontend nginx
        proxy_pass_header Cache-Control;
        proxy_pass_header Pragma;
        proxy_pass_header Expires;
    }
}
